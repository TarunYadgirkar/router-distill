[project]
name = "router-distill"
version = "0.1.0"
description = "Distilled routing agent: can a tiny model imitate a frontier router, and is the best solver the best teacher?"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "numpy>=2.0",
    "scikit-learn>=1.5",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/router_distill"]
