name: ci

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Rebuild the report from committed data and compare
        run: make check
